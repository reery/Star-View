<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">Finding the Andromeda Galaxy</title>
  <desc id="desc">From Mirach, hop north through Mu and Nu Andromedae to the elongated glow of the Andromeda Galaxy. The galaxy outline shows its approximate 3 × 1 degree extent. Positions are projected from catalogue coordinates, north up and east left.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffba68"/></marker></defs>
  <rect width="840" height="480" fill="#101112"/>
  <g font-family="system-ui, sans-serif">
    <path d="M688.1 424.0L528.2 384.7" stroke="#77736e" stroke-width="2" fill="none"/>
    <path d="M528.2 384.7L383.6 263.7" stroke="#77736e" stroke-width="2" fill="none"/>
    <path d="M151.9 56.0L383.6 263.7" stroke="#77736e" stroke-width="2" fill="none"/>
    <path d="M383.6 263.7L450.7 200.5" stroke="#77736e" stroke-width="2" fill="none"/>
    <path d="M450.7 200.5L485.7 141.0" stroke="#77736e" stroke-width="2" fill="none"/>
    <path d="M383.6 263.7L450.7 200.5" stroke="#ffba68" stroke-width="2.5" stroke-dasharray="9 8" fill="none"/>
    <path d="M450.7 200.5L510.8 144.0" stroke="#ffba68" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)" fill="none"/>
    <ellipse cx="517.5" cy="137.7" rx="35.4" ry="11.8" transform="rotate(55 517.5 137.7)" fill="#e8dcc6" fill-opacity="0.22" stroke="#e8dcc6" stroke-opacity="0.5"/>
    <ellipse cx="517.5" cy="137.7" rx="10.6" ry="3.8" transform="rotate(55 517.5 137.7)" fill="#f3e8d4" fill-opacity="0.6"/>
    <circle cx="688.1" cy="424.0" r="6.0" fill="#ded8ce"/>
    <circle cx="528.2" cy="384.7" r="3.9" fill="#ded8ce"/>
    <circle cx="485.7" cy="141.0" r="2.6" fill="#ded8ce"/>
    <circle cx="450.7" cy="200.5" r="2.9" fill="#ded8ce"/>
    <circle cx="383.6" cy="263.7" r="6.0" fill="#ded8ce"/>
    <circle cx="151.9" cy="56.0" r="5.9" fill="#ded8ce"/>
    <text x="688.1" y="456.0" text-anchor="middle" fill="#ded8ce" font-size="24">Alpheratz</text>
    <text x="383.6" y="295.7" text-anchor="middle" fill="#ded8ce" font-size="24">Mirach</text>
    <text x="151.9" y="88.0" text-anchor="middle" fill="#ded8ce" font-size="24">Almach</text>
    <text x="464.7" y="206.5" text-anchor="start" fill="#a5a29e" font-size="20">Mu</text>
    <text x="471.7" y="147.0" text-anchor="end" fill="#a5a29e" font-size="20">Nu</text>
    <text x="517.5" y="93.7" text-anchor="middle" fill="#ded8ce" font-size="24">Andromeda Galaxy (M31)</text>
  </g>
</svg>
