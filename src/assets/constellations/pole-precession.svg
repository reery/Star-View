  <title id="title">The wandering north celestial pole</title>
  <desc id="desc">Over about 26,000 years, Earth’s axis traces a circle around the ecliptic pole. The pole lay near Thuban when the pyramids were built, is near Polaris today, and will pass Errai, Deneb and Vega. Positions are projected from catalogue coordinates; stars do not lie exactly on the circle.</desc>
