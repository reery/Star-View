<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">Taurus in depth</title>
  <desc id="desc">Aldebaran appears to sit in the V-shaped Hyades cluster, but it is less than half as far away. The Pleiades are nearly three times more distant than the Hyades. Sky positions are projected from catalogue coordinates; distances are drawn to scale.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffba68"/></marker></defs>
  <rect width="840" height="480" fill="#101112"/>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="40" fill="#a5a29e" font-size="20">As seen from Earth</text>
    <text x="24" y="290" fill="#a5a29e" font-size="20">Distance from Earth</text>
    <path d="M60 370H800" stroke="#77736e" stroke-width="2"/>
    <path d="M60.0 364v12" stroke="#77736e" stroke-width="2"/>
