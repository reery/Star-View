    <path d="M208.0 364v12" stroke="#77736e" stroke-width="2"/>
    <text x="208.0" y="402" text-anchor="middle" fill="#a5a29e" font-size="18">100 ly</text>
    <path d="M356.0 364v12" stroke="#77736e" stroke-width="2"/>
    <text x="356.0" y="402" text-anchor="middle" fill="#a5a29e" font-size="18">200 ly</text>
    <path d="M504.0 364v12" stroke="#77736e" stroke-width="2"/>
    <text x="504.0" y="402" text-anchor="middle" fill="#a5a29e" font-size="18">300 ly</text>
    <path d="M652.0 364v12" stroke="#77736e" stroke-width="2"/>
    <text x="652.0" y="402" text-anchor="middle" fill="#a5a29e" font-size="18">400 ly</text>
    <path d="M800.0 364v12" stroke="#77736e" stroke-width="2"/>
    <text x="800.0" y="402" text-anchor="middle" fill="#a5a29e" font-size="18">500 ly</text>
    <path d="M348.6 176.0L159.2 356" stroke="#77736e" stroke-width="1.4" stroke-dasharray="4 6" fill="none"/>
    <circle cx="348.6" cy="176.0" r="7" fill="#f0a868"/>
    <circle cx="159.2" cy="370" r="8" fill="#f0a868"/>
    <text x="332.6" y="184.0" text-anchor="end" fill="#ded8ce" font-size="24">Aldebaran</text>
    <text x="159.2" y="354" text-anchor="middle" fill="#ded8ce" font-size="20">67 ly</text>
    <path d="M382.1 187.0L286.4 356" stroke="#77736e" stroke-width="1.4" stroke-dasharray="4 6" fill="none"/>
    <circle cx="382.1" cy="187.0" r="7" fill="#ffd9a0"/>
    <circle cx="286.4" cy="370" r="8" fill="#ffd9a0"/>
    <text x="398.1" y="195.0" text-anchor="start" fill="#ded8ce" font-size="24">Hyades</text>
    <text x="286.4" y="354" text-anchor="middle" fill="#ded8ce" font-size="20">153 ly</text>
    <path d="M529.3 57.0L717.1 356" stroke="#77736e" stroke-width="1.4" stroke-dasharray="4 6" fill="none"/>
    <circle cx="529.3" cy="57.0" r="7" fill="#8da9d6"/>
    <circle cx="717.1" cy="370" r="8" fill="#8da9d6"/>
    <text x="529.3" y="39.0" text-anchor="middle" fill="#ded8ce" font-size="24">Pleiades</text>
