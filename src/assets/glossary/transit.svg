<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">A planet transiting its star</title>
  <desc id="desc">A small dark planet crosses the face of a star. A light curve below stays level, dips by a tiny amount during the crossing, and recovers.</desc>
  <defs><radialGradient id="star"><stop stop-color="#ffdf9e"/><stop offset="1" stop-color="#d99655"/></radialGradient></defs>
  <rect width="840" height="360" fill="#101112"/>
  <circle cx="420" cy="104" r="88" fill="url(#star)"/>
  <circle cx="240" cy="124" r="13" fill="#2a2c30" stroke="#a5a29e" stroke-width="2"/><circle cx="420" cy="124" r="13" fill="#20140c"/><circle cx="600" cy="124" r="13" fill="#2a2c30" stroke="#a5a29e" stroke-width="2"/>
  <path d="M254 124H406M434 124H586" stroke="#77736e" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M65 228V324H790" fill="none" stroke="#77736e" stroke-width="2"/>
  <path d="M75 244H330L356 296H484L510 244H780" fill="none" stroke="#ffba68" stroke-width="5"/>
  <g font-family="system-ui, sans-serif" font-size="23" fill="#a5a29e"><text x="80" y="221">Star’s brightness</text><text x="760" y="352" text-anchor="end">Time →</text><text x="420" y="282" text-anchor="middle">Dip while crossing</text></g>
</svg>
