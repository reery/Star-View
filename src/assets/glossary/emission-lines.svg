<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Absorption and emission lines</title>
  <desc id="desc">Schematic spectra show absorption as dips below the surrounding continuum and emission as peaks above it. These are illustrative curves, not observed spectra.</desc>
  <rect width="840" height="360" fill="#101112"/>
  <g font-family="system-ui, sans-serif" fill="#ded8ce" font-size="28">
    <text x="62" y="43">Absorption lines</text><text x="62" y="210">Emission lines</text>
    <text x="420" y="343" text-anchor="middle" fill="#a5a29e" font-size="25">Wavelength →</text>
  </g>
  <path d="M60 58V151H790M60 224V305H790" fill="none" stroke="#77736e" stroke-width="2"/>
  <path d="M70 80H205Q218 80 228 133Q238 80 251 80H393Q406 80 420 139Q434 80 447 80H580Q593 80 607 122Q621 80 634 80H780" fill="none" stroke="#8da9d6" stroke-width="5"/>
  <path d="M70 287H205Q218 287 228 232Q238 287 251 287H393Q406 287 420 222Q434 287 447 287H580Q593 287 607 240Q621 287 634 287H780" fill="none" stroke="#ffba68" stroke-width="5"/>
</svg>
