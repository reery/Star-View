<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">A tidally locked body</title>
  <desc id="desc">At four points around its orbit, a moon keeps the same marked side facing the central body, because it spins once for each orbit.</desc>
  <rect width="840" height="360" fill="#101112"/>
  <circle cx="420" cy="180" r="124" fill="none" stroke="#77736e" stroke-width="2" stroke-dasharray="9 8"/>
  <circle cx="420" cy="180" r="50" fill="#5f8fc8"/>
  <g fill="#c9c3b8"><circle cx="544" cy="180" r="24"/><circle cx="420" cy="56" r="24"/><circle cx="296" cy="180" r="24"/><circle cx="420" cy="304" r="24"/></g>
  <g fill="#e7a05b"><circle cx="530" cy="180" r="8"/><circle cx="420" cy="70" r="8"/><circle cx="310" cy="180" r="8"/><circle cx="420" cy="290" r="8"/></g>
  <g font-family="system-ui, sans-serif" font-size="25" fill="#ded8ce"><text x="590" y="170">Same marked side</text><text x="590" y="200">always faces inward</text></g>
</svg>
