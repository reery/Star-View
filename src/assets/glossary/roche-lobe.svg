<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Roche lobes of a close binary</title>
  <desc id="desc">A figure-eight outline surrounds two stars. The larger star fills its lobe, and gas crosses the narrow point between the lobes toward the companion.</desc>
  <rect width="840" height="360" fill="#101112"/>
  <path d="M430 180C430 92 356 62 262 62C150 62 74 112 74 180C74 248 150 298 262 298C356 298 430 268 430 180C430 124 490 92 570 92C650 92 712 130 712 180C712 230 650 268 570 268C490 268 430 236 430 180Z" fill="none" stroke="#77736e" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="262" cy="180" r="112" fill="#d9834f"/><path d="M372 164Q402 172 430 180Q490 178 520 152" fill="none" stroke="#ffba68" stroke-width="7" stroke-linecap="round"/>
  <circle cx="570" cy="180" r="30" fill="#8da9d6"/><path d="M570 128A52 52 0 1 1 518 180" fill="none" stroke="#ffba68" stroke-width="5" opacity=".6"/>
  <g font-family="system-ui, sans-serif" font-size="25" fill="#ded8ce" text-anchor="middle"><text x="262" y="188">Star filling its lobe</text><text x="430" y="330">Gas crosses here</text><text x="620" y="58">Companion’s lobe</text></g>
</svg>
