<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Dust dims and reddens starlight</title>
  <desc id="desc">White starlight enters a dust cloud. Blue light scatters away to the sides while redder light carries on, so the star looks fainter and redder to the observer.</desc>
  <rect width="840" height="360" fill="#101112"/>
  <circle cx="90" cy="180" r="42" fill="#f4f1e6"/>
  <ellipse cx="420" cy="180" rx="130" ry="132" fill="#4a3d33"/><g fill="#6d5a4a"><circle cx="360" cy="110" r="4"/><circle cx="470" cy="94" r="4"/><circle cx="330" cy="210" r="4"/><circle cx="420" cy="160" r="4"/><circle cx="500" cy="230" r="4"/><circle cx="400" cy="270" r="4"/><circle cx="465" cy="165" r="4"/></g>
  <g stroke-width="6" fill="none" stroke-linecap="round"><path d="M136 180H290" stroke="#f4f1e6"/><path d="M550 180H716" stroke="#d9743f"/><path d="M360 170L300 56" stroke="#7fa5e8"/><path d="M450 196L520 316" stroke="#7fa5e8"/></g>
  <circle cx="770" cy="180" r="18" fill="#d9743f"/>
  <g font-family="system-ui, sans-serif" font-size="25" fill="#ded8ce" text-anchor="middle"><text x="90" y="262">Star</text><text x="420" y="188">Dust cloud</text><text x="210" y="40">Blue scatters away</text><text x="720" y="240">Looks fainter</text><text x="720" y="270">and redder</text></g>
</svg>
